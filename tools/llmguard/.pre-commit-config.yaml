repos:
  - repo: [URL_REDACTED]
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: end-of-file-fixer
        types: [ python ]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types: [ python ]
      - id: ruff check
        name: ruff-check
        entry: ruff check --force-exclude --fix
        language: system
        types: [ python ]
      - id: ruff format
        name: ruff-format
        entry: ruff format --force-exclude
        language: system
        types: [ python ]

  - repo: [URL_REDACTED]
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: [URL_REDACTED]
    rev: v0.41.0
    hooks:
      - id: markdownlint
